[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["N803", "N806"]   # X y nombres de matrices en mayúscula, convención de ML

[tool.ruff.lint.per-file-ignores]
# Textos largos del reporte PDF: el formateador no parte cadenas y partirlas a mano no aporta
"tools/generar_reporte_diagnostico.py" = ["E501"]
