name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-lock.txt
      - name: Estilo (PEP 8)
        run: ruff check src tests tools
      - name: Pruebas
        run: pytest -q
