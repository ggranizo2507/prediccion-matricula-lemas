name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Estilo (PEP 8)
        run: ruff check src tests tools app
      - name: Formato
        run: ruff format --check src tests tools app
      - name: Pruebas
        run: pytest -q
